name: APK Android offline
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'scripts/android-*.mjs', 'tests/android*', 'package*.json', 'vite.config.*', 'public/**', 'LICENSE', 'THIRD_PARTY_NOTICES.txt', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: npm ci
      - run: node scripts/android-policy-test.mjs
      - run: npm run android:prepare
      - run: npx playwright install --with-deps chromium
      - run: node scripts/android-pdf-browser.mjs
        env:
          COSMO_BROWSER: chromium
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: APK futuro per il solo collaudo, stessa chiave debug e codice superiore
        run: |
          gradle -p android --no-daemon -PcosmoTestFixture :app:assembleDebug
          mkdir -p android/app/src/androidTest/assets/updates
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/src/androidTest/assets/updates/future.apk
      - run: gradle -p android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug
      - run: node scripts/android-check-apk.mjs
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Abilita KVM nel runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: node scripts/android-smoke.mjs
      - name: APK compilato dalla CI, firma privata soltanto locale
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release/android/CosmOffice-0.2.3-android-unsigned.apk
          sha256sum release/android/*.apk > release/android/SHA256SUMS-unsigned.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CosmOffice-Android-da-firmare
          path: release/android/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifiche-Android
          path: |
            test-results/android/
            android/app/build/reports/
