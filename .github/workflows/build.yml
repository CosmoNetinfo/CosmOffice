name: Build e verifica CosmOffice
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          COSMO_BROWSER: chromium
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm run test:openxml
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: node scripts/pdf-independent.mjs
      - run: xvfb-run -a node scripts/offline-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifiche-browser
          path: test-results/
  interop:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc
      - run: npx playwright install --with-deps chromium
      - run: node scripts/pdf-assets.mjs
      - uses: actions/download-artifact@v4
        with:
          name: verifiche-browser
          path: test-results/
      - run: node scripts/fixtures-office.mjs
        env:
          COSMO_BROWSER: chromium
      - run: npm run test:interop
        env:
          COSMO_BROWSER: chromium
      - run: node scripts/charts-interop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifica-interoperabilita
          path: test-results/
          retention-days: 14
  desktop:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            name: Windows-x64
          - os: ubuntu-latest
            target: --linux --x64
            name: Linux-x64
          - os: macos-latest
            target: --mac --x64 --arm64
            name: macOS-Intel-AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run icons
      - run: node scripts/notices.mjs
      - run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: CosmOffice-anteprima-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
