name: Completa DMG Mac della Release 0.2.3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-mac.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin tag v0.2.3 && git diff --exit-code v0.2.3 HEAD -- src electron public package.json package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run icons
      - run: node scripts/notices.mjs
      - run: npx electron-builder --config electron-builder.config.cjs --mac dmg --${{ matrix.arch }} --publish never
      - run: node scripts/package-resources-check.mjs
        env:
          COSMO_PACKAGE_MAC_ARCH: ${{ matrix.arch }}
      - run: hdiutil verify release/*.dmg
      - name: Controlla architettura e identità assente
        shell: bash
        run: |
          binary=$(find release -path '*/CosmOffice.app/Contents/MacOS/CosmOffice' -type f -print -quit)
          test -n "$binary"
          lipo -archs "$binary" | grep -w '${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}'
          bundle="${binary%/Contents/MacOS/CosmOffice}"
          if codesign -dv "$bundle" 2>&1 | grep -q 'Authority=Developer ID'; then
            echo 'Errore: trovato Developer ID inatteso.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DMG-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
  pubblica:
    needs: dmg
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: DMG-*
          path: release-public
          merge-multiple: true
      - name: Attendi la Release ordinaria del tag
        run: node --input-type=module -e 'for(let i=0;i<45;i++){const r=await fetch("https://api.github.com/repos/CosmoNetinfo/CosmOffice/releases/tags/v0.2.3",{headers:{Authorization:"Bearer "+process.env.GH_TOKEN,Accept:"application/vnd.github+json"}});if(r.ok){const v=await r.json();if(!v.draft&&!v.prerelease){console.log("Release 0.2.3 pubblica, procedo con i soli DMG mancanti.");process.exit(0);}}else if(r.status!==404)throw Error("GitHub HTTP "+r.status);await new Promise(resolve=>setTimeout(resolve,20000));}throw Error("Release 0.2.3 non pubblicata entro 15 minuti.");'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/complete-preview.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSMO_RELEASE_DIR: release-public
          COSMO_PACKAGE_RESULT: ${{ needs.dmg.result }}
          COSMO_ALLOW_EMPTY: '1'
