name: Completa DMG Mac della Release 0.2.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-mac.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin tag v0.2.2 && git diff --exit-code v0.2.2 HEAD -- src electron public package.json package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run icons
      - run: node scripts/notices.mjs
      - run: npx electron-builder --config electron-builder.config.cjs --mac dmg --${{ matrix.arch }} --publish never
      - run: hdiutil verify release/*.dmg
      - name: Controlla architettura e identità assente
        shell: bash
        run: |
          binary=$(find release -path '*/CosmOffice.app/Contents/MacOS/CosmOffice' -type f -print -quit)
          test -n "$binary"
          lipo -archs "$binary" | grep -w '${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}'
          bundle="${binary%/Contents/MacOS/CosmOffice}"
          if codesign -dv "$bundle" 2>&1 | grep -q 'Authority=Developer ID'; then
            echo 'Errore: trovato Developer ID inatteso.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DMG-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
  pubblica:
    needs: dmg
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: DMG-*
          path: release-public
          merge-multiple: true
      - run: node scripts/complete-preview.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSMO_RELEASE_DIR: release-public
          COSMO_PACKAGE_RESULT: ${{ needs.dmg.result }}
          COSMO_ALLOW_EMPTY: '1'
