name: Release pubblica di anteprima
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          COSMO_BROWSER: chromium
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm run test:openxml
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-writer libreoffice-calc
      - run: xvfb-run -a node scripts/legal-smoke.mjs
      - run: xvfb-run -a node scripts/markdown-desktop-smoke.mjs
      - run: xvfb-run -a node scripts/offline-smoke.mjs
      - run: xvfb-run -a node scripts/update-network-smoke.mjs
      - run: xvfb-run -a node scripts/debug-smoke.mjs
      - run: xvfb-run -a node scripts/guided-smoke.mjs
      - run: node scripts/fixtures-office.mjs
        env:
          COSMO_BROWSER: chromium
      - run: npm run test:interop
        env:
          COSMO_BROWSER: chromium
      - run: node scripts/charts-interop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifiche-release
          path: test-results/
  pacchetti:
    needs: verifica
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis --x64
            name: Windows-x64
          - os: ubuntu-latest
            target: --linux AppImage --x64
            name: Linux-x64
          - os: macos-latest
            target: --mac dmg --x64
            name: Mac-Intel
          - os: macos-latest
            target: --mac dmg --arm64
            name: Mac-AppleSilicon
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run icons
      - run: node scripts/notices.mjs
      - run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never
      - run: node scripts/package-resources-check.mjs
      - run: hdiutil verify release/*.dmg
        if: runner.os == 'macOS'
      - run: node scripts/debug-smoke.mjs
        if: runner.os == 'Windows'
        env:
          COSMO_DEBUG_PACKAGE: '1'
      - run: node scripts/guided-smoke.mjs
        if: runner.os == 'Windows'
        env:
          COSMO_DEBUG_PACKAGE: '1'
      - run: node scripts/markdown-desktop-smoke.mjs --package
        if: runner.os == 'Windows'
      - run: node scripts/legal-smoke.mjs --package
        if: runner.os == 'Windows'
      - run: node scripts/update-network-smoke.mjs --package
        if: runner.os == 'Windows'
      - run: node scripts/update-confirm-smoke.mjs
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*-Setup.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error
  pubblica:
    needs: [verifica, pacchetti]
    if: always() && needs.verifica.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-public
          merge-multiple: true
      - run: node scripts/publish-preview.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSMO_RELEASE_DIR: release-public
          COSMO_PACKAGE_RESULT: ${{ needs.pacchetti.result }}
