name: Release firmata e aggiornamenti
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
          - os: ubuntu-latest
            target: --linux --x64
          - os: macos-latest
            target: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    env:
      COSMO_PUBLISH_UPDATES: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
      WIN_PUBLISHER_NAME: ${{ secrets.WIN_PUBLISHER_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npm run icons
      - run: node scripts/notices.mjs
      - run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish always
