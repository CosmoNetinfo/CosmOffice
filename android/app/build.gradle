plugins { id 'com.android.application' }
android {
    namespace 'it.cosmonet.cosmoffice'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'it.cosmonet.cosmoffice'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.3'
        testInstrumentationRunner 'it.cosmonet.cosmoffice.SmokeInstrumentation'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
// Only platform APIs: no additional runtime or testing libraries in the APK.
